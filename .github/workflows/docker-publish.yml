# Construye y publica las imágenes del backend y del front en GHCR cada vez que
# cambia su código en main. Watchtower (docker-compose.yml) las descarga solo.
name: Publicar imágenes Docker

on:
  push:
    branches: [main]
    paths:
      - "ChaosLauncher-Backend/**"
      - "ChaosLauncher-Front/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ChaosLauncher-Backend
            image: chaos-launcher-backend
          - service: front
            context: ChaosLauncher-Front
            image: chaos-launcher-front
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          # Valores del front que se incrustan al compilar (opcionales: Settings > Variables > Actions)
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
            NEXT_PUBLIC_DEFAULT_SERVER_IP=${{ vars.NEXT_PUBLIC_DEFAULT_SERVER_IP }}
            NEXT_PUBLIC_WINGET_LIVE=${{ vars.NEXT_PUBLIC_WINGET_LIVE || 'false' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
