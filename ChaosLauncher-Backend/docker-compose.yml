version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chaos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaos_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-chaos_launcher_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chaos_user} -d ${POSTGRES_DB:-chaos_launcher_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaos-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaos-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaos_user}:${POSTGRES_PASSWORD:-chaos_secret_pass}@postgres:5432/${POSTGRES_DB:-chaos_launcher_db}?schema=public
      CORS_ORIGIN: "*"
      STATUS_CACHE_TTL_SECONDS: 30
      UPLOAD_DIR: /usr/src/app/uploads
      STATIC_SERVE_PATH: /static
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chaos-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  chaos-network:
    driver: bridge
